<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-label="Performance and optimization 3D artwork">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".48" stop-color="#f7f9fa"/><stop offset="1" stop-color="#d7e0e5"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".48" stop-color="#d9e1e6"/><stop offset=".7" stop-color="#85929b"/><stop offset="1" stop-color="#f7fafb"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#8fd4ff" stop-opacity=".22"/><stop offset="1" stop-color="#8fd4ff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#526b7b" flood-opacity=".2"/><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#566875" flood-opacity=".13"/></filter>
    <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#70818b" flood-opacity=".28"/><feDropShadow dx="0" dy="-2" stdDeviation="2" flood-color="#fff" flood-opacity=".9"/></filter>
  </defs>
  <style>.core{transform-origin:360px 350px;animation:float 5.2s ease-in-out infinite}.orbit{transform-origin:360px 360px;animation:spin 11.8s linear infinite}.petal-a{transform-origin:360px 350px;animation:driftA 8s ease-in-out infinite}.petal-b{transform-origin:360px 350px;animation:driftB 9s ease-in-out infinite}.needle{transform-origin:368px 370px;animation:needle 3.8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-15px) rotate(-2deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes driftA{50%{transform:rotate(8deg) scale(1.02)}}@keyframes driftB{50%{transform:rotate(-8deg) scale(.99)}}@keyframes needle{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(17deg)}}@media (prefers-reduced-motion:reduce){.core,.orbit,.petal-a,.petal-b,.needle{animation:none}}</style>
  <circle cx="390" cy="350" r="270" fill="url(#glow)"/><ellipse cx="380" cy="588" rx="190" ry="34" fill="#5e7380" opacity=".12" filter="blur(16px)"/>
  <g class="petal-a" opacity=".82"><rect x="173" y="170" width="360" height="360" rx="112" fill="url(#surface)" stroke="#fff" stroke-width="4" transform="rotate(-35 353 350)"/><rect x="186" y="176" width="360" height="360" rx="120" fill="url(#surface)" stroke="#dfe8ed" stroke-width="2" transform="rotate(17 366 356)"/></g>
  <g class="petal-b" opacity=".7"><ellipse cx="355" cy="352" rx="254" ry="171" fill="none" stroke="#fff" stroke-width="26" transform="rotate(39 355 352)"/><ellipse cx="355" cy="352" rx="246" ry="165" fill="none" stroke="#dce7ed" stroke-width="3" transform="rotate(-33 355 352)"/></g>
  <g class="core" filter="url(#shadow)"><rect x="188" y="166" width="356" height="356" rx="88" fill="url(#surface)" stroke="#fff" stroke-width="6"/><rect x="211" y="190" width="310" height="308" rx="70" fill="#fbfcfd" stroke="#d7e1e6" stroke-width="2"/>
    <g filter="url(#iconShadow)" fill="none" stroke="url(#metal)" stroke-linecap="round" stroke-linejoin="round"><path d="M276 385a94 94 0 0 1 188 0" stroke-width="24"/><path d="M292 342l17 10M324 309l10 17M370 298v20M416 309l-10 17M448 342l-17 10" stroke-width="12"/></g>
    <g class="needle" filter="url(#iconShadow)"><path d="M369 370l76-49-58 71z" fill="url(#metal)"/><circle cx="369" cy="370" r="22" fill="url(#metal)" stroke="#fff" stroke-width="5"/></g>
  </g>
  <g class="orbit"><ellipse cx="360" cy="360" rx="294" ry="194" fill="none" stroke="#f8fcff" stroke-width="9" opacity=".88"/><ellipse cx="360" cy="360" rx="294" ry="194" fill="none" stroke="#a9bfcc" stroke-width="2" opacity=".55"/><circle cx="80" cy="424" r="18" fill="url(#surface)" stroke="#fff" stroke-width="5" filter="url(#shadow)"/></g>
</svg>