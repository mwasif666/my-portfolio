<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-label="Full-stack web applications 3D artwork">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".48" stop-color="#f7f9fa"/><stop offset="1" stop-color="#d7e0e5"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".48" stop-color="#d9e1e6"/><stop offset=".7" stop-color="#85929b"/><stop offset="1" stop-color="#f7fafb"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#8fd4ff" stop-opacity=".22"/><stop offset="1" stop-color="#8fd4ff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#526b7b" flood-opacity=".2"/><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#566875" flood-opacity=".13"/></filter>
    <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#70818b" flood-opacity=".28"/><feDropShadow dx="0" dy="-2" stdDeviation="2" flood-color="#fff" flood-opacity=".9"/></filter>
  </defs>
  <style>.core{transform-origin:360px 350px;animation:float 5.8s ease-in-out infinite}.orbit{transform-origin:360px 360px;animation:spin 15s linear infinite}.petal-a{transform-origin:360px 350px;animation:driftA 8.8s ease-in-out infinite}.petal-b{transform-origin:360px 350px;animation:driftB 9.8s ease-in-out infinite}.layer-one{animation:layerOne 4.8s ease-in-out infinite}.layer-two{animation:layerTwo 4.8s ease-in-out infinite}.layer-three{animation:layerThree 4.8s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(1deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes driftA{50%{transform:rotate(8deg) scale(1.02)}}@keyframes driftB{50%{transform:rotate(-8deg) scale(.99)}}@keyframes layerOne{50%{transform:translateY(-7px)}}@keyframes layerTwo{50%{transform:translateY(2px)}}@keyframes layerThree{50%{transform:translateY(8px)}}@media (prefers-reduced-motion:reduce){.core,.orbit,.petal-a,.petal-b,.layer-one,.layer-two,.layer-three{animation:none}}</style>
  <circle cx="390" cy="350" r="270" fill="url(#glow)"/><ellipse cx="380" cy="588" rx="190" ry="34" fill="#5e7380" opacity=".12" filter="blur(16px)"/>
  <g class="petal-a" opacity=".82"><rect x="173" y="170" width="360" height="360" rx="112" fill="url(#surface)" stroke="#fff" stroke-width="4" transform="rotate(-34 353 350)"/><rect x="186" y="176" width="360" height="360" rx="120" fill="url(#surface)" stroke="#dfe8ed" stroke-width="2" transform="rotate(19 366 356)"/></g>
  <g class="petal-b" opacity=".7"><ellipse cx="355" cy="352" rx="254" ry="171" fill="none" stroke="#fff" stroke-width="26" transform="rotate(37 355 352)"/><ellipse cx="355" cy="352" rx="246" ry="165" fill="none" stroke="#dce7ed" stroke-width="3" transform="rotate(-31 355 352)"/></g>
  <g class="core" filter="url(#shadow)"><rect x="188" y="166" width="356" height="356" rx="88" fill="url(#surface)" stroke="#fff" stroke-width="6"/><rect x="211" y="190" width="310" height="308" rx="70" fill="#fbfcfd" stroke="#d7e1e6" stroke-width="2"/>
    <g filter="url(#iconShadow)" fill="url(#metal)" stroke="#d7e0e5" stroke-width="3"><rect class="layer-three" x="281" y="349" width="171" height="72" rx="18"/><rect class="layer-two" x="270" y="312" width="194" height="72" rx="18"/><rect class="layer-one" x="258" y="273" width="217" height="72" rx="18"/></g>
    <g fill="none" stroke="#8e9ba3" stroke-width="9" stroke-linecap="round" opacity=".8"><path d="M286 297h34M338 297h74"/><path d="M298 336h62M381 336h54"/><path d="M309 374h49M379 374h48"/></g>
  </g>
  <g class="orbit"><ellipse cx="360" cy="360" rx="294" ry="194" fill="none" stroke="#f8fcff" stroke-width="9" opacity=".88"/><ellipse cx="360" cy="360" rx="294" ry="194" fill="none" stroke="#a9bfcc" stroke-width="2" opacity=".55"/><circle cx="80" cy="424" r="18" fill="url(#surface)" stroke="#fff" stroke-width="5" filter="url(#shadow)"/></g>
</svg>